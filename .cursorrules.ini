Bu proje Borusan Otomotiv stok ve satış trendleri analizini yapan bir Streamlit uygulamasıdır.
Teknik Kurallar:
1. Görselleştirme için Plotly Express kullan.
2. Veri işleme için Pandas kullan.
3. Her analiz metriğinin/tablosunun altında "💡 Analitik Değerlendirme & Yorum" başlığı ile otomatik çıkarım yapan dinamik Türkçe metinler oluştur.
4. Kod temiz, modüler ve hata korumalı (try-except yapısında) olsun.